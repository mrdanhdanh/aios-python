# AIOS default configuration
# See backend/src/aios_core/config.py for the full field schema.

app:
  name: "aios"
  env: "dev"

logging:
  level: "INFO"
  console: true
  file: true
  file_path: "aios/logs/aios.jsonl"

audit:
  db_path: "aios/data/audit.db"

artifacts:
  dir: "aios/data/artifacts"

resources:
  max_tokens: null
  max_concurrent: null

models:
  default: "mock"
  routing:
    default: "balanced"
    policies:
      cheap:   { max_cost: 0.01 }
      fast:    { max_latency_ms: 2000 }
      quality: { min_quality: 0.9 }
      local:   { providers: ["ollama"] }

memory:
  conversation_db_path: "aios/data/conversations.db"
  knowledge_db_path: "aios/data/knowledge.db"

goals:
  db_path: "aios/data/goals.db"

skills:
  db_path: "aios/data/skills.db"

plugins:
  enabled: true
  db_path: "aios/data/plugins.db"
  strict: true

ecosystem:
  enabled: true
  db_path: "aios/data/ecosystem.db"

observability:
  db_path: "aios/data/observability.db"

planning:
  max_nodes: 32
  default_timeout_s: 300.0
  min_timeout_s: 1.0
  max_timeout_s: 3600.0
  warn_token_threshold: 20000

graph:
  max_parallel: 1
  default_failure_policy: fail_fast

scheduler:
  resource_wait_timeout_s: null

harness:
  diagnose_on_failure: true

execution:
  event_window: 10000
  persist_verdict_artifact: true

testing:
  default_retries: 1
  strict: true
  simulation_timeout_s: 30.0

evaluation:
  default_threshold: 0.8
  strict: true
  max_items: 1000

benchmark:
  max_scenarios: 100
  strict: true
  quality_max_delta: -5.0
  failure_rate_max_delta: 0.02

doctor:
  strict: true
  min_overall: 0.0
  policy_gate: true

enterprise:
  enabled: true
  isolation:
    default_tier: standard
  quota:
    concurrent_executions: 20
    cpu: 8.0
    memory_gb: 16.0
    llm_tokens_per_day: 5000000
    storage_gb: 100
    tool_calls_per_day: 100000
    sandbox_seconds_per_day: 10000
  sandbox:
    network: false
    cpu: 1.0
    memory_mb: 512
    timeout_s: 60.0
  lease_ttl_s: 60.0
  heartbeat_timeout_s: 30.0

autonomous:
  enabled: true
  db_path: "aios/data/autonomous.db"
  loop_max_iterations: 100
  budget:
    max_steps: 100
    max_llm_calls: 50
    max_cost: 10.0
    max_duration_s: 7200.0
    max_tool_calls: 200
    max_retries: 5
    max_parallel_agents: 4
  risk_table:
    read: autonomous
    edit: autonomous
    commit: approval
    deploy: approval
    delete: impossible
  correctness_min: 0.7
  risk_max: 0.8
  cost_max: 1.0
  stuck_iterations: 3
  stuck_window: 20

durability:
  enabled: true
  db_path: "aios/data/durability.db"
  policy:
    mode: resume
    require_verify: true

security:
  # M11-P3c (R8) — Vendor Integrity: {path: pinned_sha256} byte-identical.
  # Rỗng = không có vendor bundle pinned (PASS).
  vendor_bundles: {}
