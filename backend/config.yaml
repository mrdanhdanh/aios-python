# AIOS default configuration
# See backend/src/aios_core/config.py for the full field schema.

app:
  name: "aios"
  env: "dev"

logging:
  level: "INFO"
  console: true
  file: true
  file_path: "aios/logs/aios.jsonl"

audit:
  db_path: "aios/data/audit.db"

artifacts:
  dir: "aios/data/artifacts"

resources:
  max_tokens: null
  max_concurrent: null

models:
  default: "mock"
  routing:
    default: "balanced"
    policies:
      cheap:   { max_cost: 0.01 }
      fast:    { max_latency_ms: 2000 }
      quality: { min_quality: 0.9 }
      local:   { providers: ["ollama"] }

memory:
  conversation_db_path: "aios/data/conversations.db"
  knowledge_db_path: "aios/data/knowledge.db"

goals:
  db_path: "aios/data/goals.db"

skills:
  db_path: "aios/data/skills.db"

observability:
  db_path: "aios/data/observability.db"

planning:
  max_nodes: 32
  default_timeout_s: 300.0
  min_timeout_s: 1.0
  max_timeout_s: 3600.0
  warn_token_threshold: 20000

graph:
  max_parallel: 1
  default_failure_policy: fail_fast

scheduler:
  resource_wait_timeout_s: null

harness:
  diagnose_on_failure: true

execution:
  event_window: 10000
  persist_verdict_artifact: true

testing:
  default_retries: 1
  strict: true
  simulation_timeout_s: 30.0

evaluation:
  default_threshold: 0.8
  strict: true
  max_items: 1000

benchmark:
  max_scenarios: 100
  strict: true
  quality_max_delta: -5.0
  failure_rate_max_delta: 0.02
