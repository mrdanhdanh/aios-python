# AIOS default configuration
# See backend/src/aios_core/config.py for the full field schema.

app:
  name: "aios"
  env: "dev"

logging:
  level: "INFO"
  console: true
  file: true
  file_path: "aios/logs/aios.jsonl"

audit:
  db_path: "aios/data/audit.db"

artifacts:
  dir: "aios/data/artifacts"

resources:
  max_tokens: null
  max_concurrent: null

models:
  default: "mock"
