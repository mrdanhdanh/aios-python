[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aios-core"
description = "AIOS backend core: config, logging, metadata, healthcheck"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AIOS Team" }]
dynamic = ["version"]
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
aiagent = "aios_core.workflow.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
]

[tool.hatch.version]
path = "src/aios_core/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=aios_core --cov-report=term-missing --cov-fail-under=80"
markers = [
    "benchmark: performance smoke tests (skip with -m 'not benchmark')",
]
