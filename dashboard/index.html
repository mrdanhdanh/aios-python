<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIOS Dashboard</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #0f1420; color: #e6e9f0; }
      nav { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px; background: #161d2e; }
      nav button { background: #22304d; color: #e6e9f0; border: 0; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
      nav button.active { background: #3b6fd4; }
      main { padding: 16px; max-width: 1100px; margin: 0 auto; }
      .card { background: #161d2e; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
      .ok { color: #5ad08e; } .fail { color: #ff7b72; }
      pre { background: #0b0f1a; padding: 8px; border-radius: 6px; overflow-x: auto; }
      input, textarea { background: #0b0f1a; color: #e6e9f0; border: 1px solid #2a3a5c; border-radius: 6px; padding: 8px; }
      button.primary { background: #3b6fd4; color: #fff; border: 0; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
      .error { color: #ff7b72; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
